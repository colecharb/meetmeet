[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetmeet"
version = "0.1.2"
description = "Lightweight terminal app for capturing meeting audio and producing live transcripts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cole Charbonneau" }]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "mlx-whisper>=0.4",
    "httpx>=0.27",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0"]

[project.scripts]
meetmeet = "meetmeet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meetmeet"]
